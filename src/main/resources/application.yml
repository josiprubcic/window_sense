server:
  port: ${PORT:3000}

debug: false

logging:
  level:
    root: INFO
    org.springframework: INFO

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]
  application:
    name: windowsense
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:public/

windowsense:
  commands:
    physical-delivery: ${WINDOWSENSE_COMMANDS_PHYSICAL_DELIVERY:polling}
    rpc:
      enabled: ${WINDOWSENSE_COMMANDS_RPC_ENABLED:false}
      timeout-ms: ${WINDOWSENSE_COMMANDS_RPC_TIMEOUT_MS:15000}
      persistent: ${WINDOWSENSE_COMMANDS_RPC_PERSISTENT:false}
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
  virtual-simulator:
    enabled: ${VIRTUAL_SIMULATOR_ENABLED:false}
    publish-to-things-board: ${VIRTUAL_SIMULATOR_PUBLISH_TO_THINGSBOARD:false}
    mqtt-rpc-enabled: ${VIRTUAL_SIMULATOR_MQTT_RPC_ENABLED:false}
    mqtt-reconnect-interval-ms: ${VIRTUAL_SIMULATOR_MQTT_RECONNECT_INTERVAL_MS:10000}
    interval-ms: ${VIRTUAL_SIMULATOR_INTERVAL_MS:5000}
    rain-state-file-path: ${RAIN_STATE_FILE_PATH:./stanje_kise.txt}
    weather-data-file-path: ${WEATHER_DATA_FILE_PATH:./vrijeme.csv}
  security:
    oidc:
      enabled: ${OIDC_ENABLED:false}
      issuer-uri: ${OIDC_ISSUER_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}
      scopes: ${OIDC_SCOPES:openid,profile,email}
  things-board:
    host: ${THINGSBOARD_HOST:}
    mqtt-host: ${THINGSBOARD_MQTT_HOST:}
    provisioning-enabled: ${THINGSBOARD_PROVISIONING_ENABLED:false}
    provisioning-auth-mode: ${THINGSBOARD_PROVISIONING_AUTH_MODE:password}
    delete-mode: ${THINGSBOARD_DELETE_MODE:soft}
    username: ${THINGSBOARD_USERNAME:}
    password: ${THINGSBOARD_PASSWORD:}
    jwt-token: ${THINGSBOARD_JWT_TOKEN:}
    api-key: ${THINGSBOARD_API_KEY:}
