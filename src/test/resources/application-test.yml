spring:
  datasource:
    url: jdbc:h2:mem:windowsense;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

windowsense:
  automation:
    engine: backend
  virtual-simulator:
    enabled: false
    publish-to-things-board: false
    mqtt-rpc-enabled: false
  things-board:
    rule-chains:
      auto-sync: false
